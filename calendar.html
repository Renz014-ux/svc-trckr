<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scheduling Calendar | Service Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts: Figtree -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- FullCalendar.js & SweetAlert2 -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  :root {
    --nrd-blue: #1d6a96; --nrd-orange: #f08a35; --nrd-red: #d93838;
    --surface-bg: #f4f7f9; --surface-card: #ffffff; --border-light: #e2e8f0;
    --text-main: #1e293b; --text-muted: #64748b;
    --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
  }

  [data-theme="dark"] {
    --surface-bg: #0f172a; --surface-card: #1e293b; --border-light: #334155;
    --text-main: #f8fafc; --text-muted: #94a3b8;
  }
  
  [data-theme="dark"] body {
      background-image: 
          radial-gradient(circle at 0% 0%, rgba(29, 106, 150, 0.25) 0%, transparent 60%),
          radial-gradient(circle at 100% 0%, rgba(240, 138, 53, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 100% 100%, rgba(217, 56, 56, 0.15) 0%, transparent 60%);
  }
  
  * { box-sizing: border-box; }
  
  html, body { margin: 0; padding: 0; }
  
  body { 
      font-family: 'Figtree', sans-serif; color: var(--text-main); 
      padding: 20px; transition: background-color 0.3s, color 0.3s;
      background-color: var(--surface-bg);
      background-image: 
          radial-gradient(circle at 0% 0%, rgba(29, 106, 150, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 100% 0%, rgba(240, 138, 53, 0.12) 0%, transparent 60%),
          radial-gradient(circle at 100% 100%, rgba(217, 56, 56, 0.10) 0%, transparent 60%);
      background-attachment: fixed;
  }
  
  .wrap { max-width: 1280px; margin: 0 auto; position: relative; } 
  
  .top-header-card { 
      background-color: var(--surface-card); 
      border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
      margin-bottom: 20px; border-top: 5px solid var(--nrd-blue); 
  }

  .top-header-top { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; background: linear-gradient(135deg, var(--nrd-blue), var(--nrd-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin: 2px 0 0 0; font-weight: 500; }
  
  .nav-tabs { display: flex; gap: 32px; padding: 0 24px; background: rgba(100, 116, 139, 0.03); border-top: 1px solid var(--border-light); border-radius: 0 0 16px 16px;}
  .nav-tab { padding: 14px 0; font-size: 14px; font-weight: 600; color: var(--text-muted); text-decoration: none; transition: all 0.2s; position: relative; }
  .nav-tab:hover, .nav-tab.active { color: var(--nrd-blue); }
  .nav-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--nrd-blue); border-radius: 3px 3px 0 0; }

  /* FILTER BAR UX */
  .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;}
  .filter-group { display: flex; gap: 8px; }
  .filter-btn { background: var(--surface-card); border: 1px solid var(--border-light); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-family: 'Figtree';}
  .filter-btn:hover, .filter-btn.active { background: var(--nrd-blue); color: white; border-color: var(--nrd-blue); }

  .calendar-card {
      background: var(--surface-card); border-radius: 16px; padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border-light);
      position: relative;
  }

  .btn-action { background: var(--nrd-orange); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: 'Figtree', sans-serif;}
  .btn-action:hover { background: #e07a2a; transform: translateY(-1px); }

  /* FULLCALENDAR FIXES FOR OFFSET DRAG CURSOR */
  .fc-view-harness, .fc-view-harness * { transform: none !important; }
  .fc-event-dragging { opacity: 0.9 !important; z-index: 9999 !important; box-shadow: 0 12px 30px rgba(0,0,0,0.25) !important; }
  .fc-theme-standard .fc-scrollgrid { border-color: var(--border-light); border-radius: 12px; overflow: hidden; }
  .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border-light); }
  .fc-event { border-radius: 6px; padding: 3px 6px; font-size: 11px; font-weight: 600; cursor: grab; border: none; margin-bottom: 2px !important;}
  .fc-event:active { cursor: grabbing; }
  .fc-button-primary { background-color: var(--nrd-blue) !important; border-color: var(--nrd-blue) !important; }
  .fc-event-title-container { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* DONE EVENT STYLING */
  .event-done { opacity: 0.75; }
  .status-tag-done { background: #10b981; color: white; font-size: 9px; padding: 1px 4px; border-radius: 4px; margin-right: 4px; font-weight: 700; text-transform: uppercase; display: inline-block; }
  .status-tag-pending { background: #f59e0b; color: white; font-size: 9px; padding: 1px 4px; border-radius: 4px; margin-right: 4px; font-weight: 700; text-transform: uppercase; display: inline-block; }

  /* MODAL STYLES */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
  .modal-content { background: var(--surface-card); padding: 32px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 14px; background: var(--surface-bg); color: var(--text-main); outline: none; }
  
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 8px; }
  .btn-delete { background: #fee2e2; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .btn-delete:hover { background: #ef4444; color: white; }
  .btn-cancel { background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .btn-save { background: var(--nrd-blue); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }

  .legend { display: flex; gap: 16px; margin-top: 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); flex-wrap: wrap;}
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-header-card">
    <div class="top-header-top">
        <div>
            <h1>Service Tracker Scheduling</h1>
            <p class="subtitle">Pasig Technician Assignment & Dispatch Management</p>
        </div>
        <div>
            <button class="btn-action" onclick="openScheduleModal()">+ Schedule a JO</button>
        </div>
    </div>
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab">Pasig Dashboard</a>
        <a href="calendar.html" class="nav-tab active">🗓️ Calendar View</a>
    </div>
  </div>

  <div class="filter-bar">
      <div class="filter-group">
          <span style="font-size:12px; font-weight:600; color:var(--text-muted); align-self:center; margin-right:4px;">Mechanic Filter:</span>
          <button class="filter-btn active" onclick="filterMechanic('all', this)">All</button>
          <button class="filter-btn" onclick="filterMechanic('chris', this)">Chris Only</button>
          <button class="filter-btn" onclick="filterMechanic('lohen', this)">Lohen Only</button>
          <button class="filter-btn" onclick="filterMechanic('unassigned', this)">Unassigned</button>
      </div>
  </div>

  <div class="calendar-card">
      <div id="calendar"></div>
      <div class="legend">
          <div class="legend-item"><div class="legend-color" style="background: var(--nrd-blue);"></div> Chris</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--nrd-orange);"></div> Lohen</div>
          <div class="legend-item"><div class="legend-color" style="background: #94a3b8;"></div> Unassigned</div>
          <div class="legend-item" style="margin-left: auto;"><span class="status-tag-done">✓ DONE</span> Resolved Unit</div>
          <div class="legend-item"><span class="status-tag-pending">PENDING</span> In-Service Unit</div>
      </div>
  </div>
</div>

<!-- SCHEDULE MODAL -->
<div class="modal-overlay" id="scheduleModal">
  <div class="modal-content">
      <h2 style="margin-top:0;" id="modalTitle">Assign Schedule</h2>
      
      <div class="form-group">
          <label>Job Order Number</label>
          <select id="joSelect" class="form-control">
              <option value="">Loading JOs...</option>
          </select>
      </div>
      
      <div class="form-group">
          <label>Scheduled Date</label>
          <input type="date" id="schedDate" class="form-control">
      </div>
      
      <div class="form-group">
          <label>Assigned Mechanic</label>
          <select id="mechanicSelect" class="form-control">
              <option value="">-- Select Mechanic --</option>
              <option value="Chris">Chris</option>
              <option value="Lohen">Lohen</option>
          </select>
      </div>
      
      <div class="modal-actions">
          <button class="btn-delete" id="deleteBtn" onclick="deleteSchedule()" style="display:none;">🗑️ Delete Schedule</button>
          <div style="display: flex; gap: 8px; margin-left: auto;">
              <button class="btn-cancel" onclick="closeModal()">Cancel</button>
              <button class="btn-save" onclick="saveSchedule()" id="saveBtn">Save Schedule</button>
          </div>
      </div>
  </div>
</div>

<script>
// ==========================================
// ILAGAY DITO ANG BAGONG WEB APP URL MO
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbwrJ3OwlTptfFAuzW6jXpQHJx3HA9bBHHv389wYmJuXSRbloJhOUEd8nWjZY3KLo6HE/exec"; 

let RAW_DATA = [];
let calendar;
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', function() {
    initCalendar();
    fetchData();
});

// Helper Function para i-clean at i-format ang Date String sa YYYY-MM-DD
function sanitizeDate(dateStr) {
    if (!dateStr || dateStr === "-" || dateStr === "NaT") return null;
    let d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    let year = d.getFullYear();
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function initCalendar() {
    var calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        editable: true,
        droppable: true,
        dragScroll: false,
        height: 650,
        eventContent: function(arg) {
            let isDone = arg.event.extendedProps.isDone;
            let statusBadge = isDone 
                ? `<span class="status-tag-done">✓ DONE</span>` 
                : `<span class="status-tag-pending">PENDING</span>`;
            
            let customEl = document.createElement('div');
            customEl.className = 'fc-event-title-container';
            let issueText = arg.event.extendedProps.issue ? `\nIssue: ${arg.event.extendedProps.issue}` : '';
            customEl.title = `${arg.event.title}${issueText}`;
            customEl.innerHTML = `${statusBadge} <span>${arg.event.title}</span>`;
            return { domNodes: [customEl] };
        },
        eventClick: function(info) {
            openScheduleModal(info.event.id, info.event.startStr, info.event.extendedProps.mechanic);
        },
        eventDrop: function(info) {
            handleDragDrop(info.event.id, info.event.startStr);
        }
    });
    calendar.render();
}

async function fetchData() {
    try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Network error");
        RAW_DATA = await res.json();
        
        populateCalendar();
        populateJODropdown();
    } catch (err) {
        console.error("Fetch error:", err);
    }
}

function populateCalendar() {
    calendar.removeAllEvents();
    
    let scheduledRecords = RAW_DATA.filter(r => {
        let cleanDate = sanitizeDate(r.dateScheduled);
        return cleanDate !== null;
    });
    
    if (currentFilter !== 'all') {
        scheduledRecords = scheduledRecords.filter(r => {
            let m = (r.mechanic || "").toLowerCase();
            if (currentFilter === 'chris') return m.includes('chris');
            if (currentFilter === 'lohen') return m.includes('lohen');
            if (currentFilter === 'unassigned') return !m.includes('chris') && !m.includes('lohen');
            return true;
        });
    }

    let events = scheduledRecords.map(r => {
        let bgColor = '#94a3b8'; // Unassigned Gray
        let mech = (r.mechanic || "").toLowerCase();
        if (mech.includes('chris')) bgColor = '#1d6a96'; // NRD Blue
        if (mech.includes('lohen')) bgColor = '#f08a35'; // NRD Orange
        
        let isDone = (r.status === "Done");
        let cleanDate = sanitizeDate(r.dateScheduled);
        let titleText = `${r.jo} - ${r.customer || "Customer"} (${r.model || "Unit"})`;
        
        return {
            id: r.jo,
            title: titleText,
            start: cleanDate,
            backgroundColor: bgColor,
            className: isDone ? 'event-done' : '',
            extendedProps: { mechanic: r.mechanic, isDone: isDone, issue: r.issue }
        };
    });
    
    calendar.addEventSource(events);
}

function filterMechanic(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = type;
    populateCalendar();
}

function populateJODropdown() {
    const select = document.getElementById("joSelect");
    select.innerHTML = '<option value="">-- Select JO to Schedule --</option>';
    
    RAW_DATA.forEach(r => {
        let opt = document.createElement('option');
        opt.value = r.jo;
        let statusText = r.status === "Done" ? " [DONE]" : " [PENDING]";
        select.appendChild(opt);
        opt.textContent = `${r.jo} - ${r.customer || "Unknown"} (${r.model || "No Model"})${statusText}`;
    });
}

function openScheduleModal(jo = "", date = "", mechanic = "") {
    const select = document.getElementById("joSelect");
    select.value = jo;
    select.disabled = jo !== ""; 
    
    document.getElementById("modalTitle").textContent = jo ? "Edit Schedule" : "Assign Schedule";
    document.getElementById("schedDate").value = sanitizeDate(date) || "";
    
    let mechSelect = document.getElementById("mechanicSelect");
    mechSelect.value = ""; 
    if(mechanic.toLowerCase().includes('chris')) mechSelect.value = "Chris";
    if(mechanic.toLowerCase().includes('lohen')) mechSelect.value = "Lohen";
    
    document.getElementById("deleteBtn").style.display = jo ? "inline-block" : "none";
    document.getElementById("scheduleModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("scheduleModal").style.display = "none";
}

function handleDragDrop(jo, newDateStr) {
    let cleanNewDate = sanitizeDate(newDateStr);
    Swal.fire({
        title: 'Reschedule JO?',
        text: `Move JO ${jo} to ${cleanNewDate}?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#1d6a96',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Yes, move it!'
    }).then((result) => {
        if (result.isConfirmed) {
            sendUpdateToBackend(jo, cleanNewDate, undefined);
        } else {
            fetchData(); 
        }
    });
}

function saveSchedule() {
    const jo = document.getElementById("joSelect").value;
    const date = document.getElementById("schedDate").value;
    const mechanic = document.getElementById("mechanicSelect").value;
    
    if(!jo || !date) {
        Swal.fire('Incomplete', 'Please select a JO and a Date.', 'warning');
        return;
    }
    
    document.getElementById("saveBtn").textContent = "Saving...";
    document.getElementById("saveBtn").disabled = true;
    
    sendUpdateToBackend(jo, date, mechanic);
}

function deleteSchedule() {
    const jo = document.getElementById("joSelect").value;
    
    Swal.fire({
        title: 'Delete Schedule?',
        text: `Are you sure you want to clear the schedule for JO ${jo}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
        if (result.isConfirmed) {
            sendUpdateToBackend(jo, "", ""); 
        }
    });
}

async function sendUpdateToBackend(jo, date, mechanic) {
    let payload = { jo: jo };
    if (date !== undefined) payload.dateScheduled = date;
    if (mechanic !== undefined) payload.mechanic = mechanic;
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if(result.status === "success") {
            Swal.fire({ title: 'Updated!', text: 'Schedule updated in Google Sheets.', icon: 'success', timer: 1500, showConfirmButton: false });
            closeModal();
            fetchData();
        } else {
            Swal.fire('Error', result.message || 'Failed to save.', 'error');
            fetchData();
        }
    } catch (e) {
        Swal.fire('Error', 'Network error. Cannot reach database.', 'error');
        fetchData();
    } finally {
        document.getElementById("saveBtn").textContent = "Save Schedule";
        document.getElementById("saveBtn").disabled = false;
    }
}
</script>
</body>
</html>
